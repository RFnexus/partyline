[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partyline"
description = "A group voice application for Reticulum built on LXST"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "rns>=1.4",
    "lxst>=0.5",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Conferencing",
]

[project.optional-dependencies]
hotkeys = ["pynput"]

[project.scripts]
partyline = "partyline.gui:main"
partyline-server = "partyline.server:main"
partyline-client = "partyline.client:main"

[project.urls]
Homepage = "https://github.com/RFnexus/partyline"

[tool.setuptools]
packages = ["partyline"]

[tool.setuptools.package-data]
partyline = ["icons/*.png", "icons/LICENSE", "sounds/*.wav", "sounds/LICENSE", "partyline.png"]

[tool.setuptools.dynamic]
version = {attr = "partyline.common.APP_VERSION"}

[tool.black]
line-length = 120
